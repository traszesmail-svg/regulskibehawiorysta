model = "gpt-6-luna"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

[agents.researcher]
description = "Read-only Luna researcher for focused repository investigation."
config_file = "agents/researcher.toml"

[agents.worker]
description = "Luna implementation worker for bounded coding tasks."
config_file = "agents/worker.toml"

[agents.tester]
description = "Luna tester for tests and regression verification."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Expensive GPT-6 Astra reviewer. Use only for compact final review when justified."
config_file = "agents/reviewer.toml"
